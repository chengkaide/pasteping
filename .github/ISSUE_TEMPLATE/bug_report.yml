name: 缺陷报告
description: 程序崩溃、功能不工作、界面异常等。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看一眼 [已知限制](https://github.com/chengkaide/pasteping#已知限制)，
        以及「首次运行遇到 SmartScreen 提示」这类**已知行为**（不是缺陷）。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你期望什么、实际发生了什么。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好 —— 从启动程序开始写。
      placeholder: |
        1. 双击 PastePing.exe
        2. 托盘右键 → 格式转换 → Markdown → Word
        3. 期望生成 .docx，实际弹出错误
      render: text
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 你是怎么运行 PastePing 的
      options:
        - 下载的 Release exe
        - 从源码运行（python main.py）
        - 其他方式
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PastePing 版本
      description: 托盘菜单 →「关于」里可以看到；源码运行请写 commit。
      placeholder: "例如：v0.2.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      description: 按 `Win + R`，输入 `winver` 回车即可看到。
      placeholder: "例如：Windows 11 家庭版 24H2 (build 26200)"
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 诊断日志（强烈建议附上）
      description: |
        文件在 `%APPDATA%\PastePing\pasteping.log`。
        **日志不含剪贴板原文**，只记长度、哈希前 8 位与规则名，可以放心粘贴：
        请贴**出问题前后的十几行**（不必贴全文）。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、报错弹窗文字、其他你试过的排查手段。
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
        - label: 这不是「检测结果不准确」类问题（那请用「误报样本」模板）
          required: true
